server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA 라우팅: 실제 파일이 없으면 index.html로 넘긴다.
    #
    # ★no-cache 를 여기에도 걸어야 한다. 아래 `location = /index.html` 은 URL 이
    #  정확히 /index.html 일 때만 잡는다. 폰은 / 로 들어오고 그건 이 블록이
    #  try_files 로 처리하므로, 여기에 헤더가 없으면 응답에 Cache-Control 이
    #  아예 안 붙는다. 그러면 브라우저(특히 홈화면에 설치한 iOS 웹앱)가
    #  제멋대로 캐시해 배포해도 옛 화면이 계속 뜬다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # ★없는 정적 파일은 404 여야 한다 (2026-08-30 실측).
    #  위 SPA 폴백이 **모든** 미스를 index.html 로 넘기는 바람에, 아직 만들지도 않은
    #  /icon-180.png 를 요청했더니 `200 · text/html · 1779B` 가 돌아왔다.
    #  아이콘 파일명이 하나만 틀려도 브라우저는 "받긴 받았다" 로 알고 조용히
    #  깨진 아이콘을 쓴다 — 다음 사람이 이걸로 반나절을 날린다.
    #  js·css 는 여기 넣지 않는다. 그건 /assets/ 아래 해시 이름으로만 오고,
    #  정규식 location 이 prefix location 보다 먼저 잡혀 캐시 설정을 덮어쓰기 때문이다.
    location ~* \.(png|jpe?g|gif|svg|ico|webp|webmanifest|json|txt)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # 해시가 붙은 빌드 산출물은 오래 캐시해도 안전하다.
    # ★expires 는 자기 몫의 Cache-Control: max-age 를 따로 내보낸다 — add_header 와
    #  같이 쓰면 헤더가 두 줄로 나간다. 한 줄로 합친다.
    # ★여기에 always 를 붙이지 말 것: 404·5xx 에까지 1년 immutable 이 붙어
    #  브라우저가 "없는 번들" 을 1년 캐시한다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html은 매번 새로 받아야 배포가 즉시 반영된다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip              on;
    # ★nginx 기본 gzip_comp_level 은 1 이다 — 명시하지 않으면 가장 약하게 압축된다.
    #  이 레포 dist 실측: 235KB(level 1) → 199KB(level 6), -35,668 B (-15.2%).
    #  9 는 6 보다 501B 더 줄이고 CPU 는 배로 든다.
    gzip_comp_level   6;
    gzip_vary         on;
    # text/javascript 는 보험이다. nginx 가 언젠가 .js 의 MIME 을 바꾸면
    # 그날부터 727KB 가 무압축으로 나간다.
    gzip_types        text/plain text/css application/javascript text/javascript
                      application/json image/svg+xml;
    gzip_min_length   256;
}
