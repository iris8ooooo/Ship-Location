server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA 라우팅: 실제 파일이 없으면 index.html로 넘긴다.
    #
    # ★no-cache 를 여기에도 걸어야 한다. 아래 `location = /index.html` 은 URL 이
    #  정확히 /index.html 일 때만 잡는다. 폰은 / 로 들어오고 그건 이 블록이
    #  try_files 로 처리하므로, 여기에 헤더가 없으면 응답에 Cache-Control 이
    #  아예 안 붙는다. 그러면 브라우저(특히 홈화면에 설치한 iOS 웹앱)가
    #  제멋대로 캐시해 배포해도 옛 화면이 계속 뜬다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 해시가 붙은 빌드 산출물은 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html은 매번 새로 받아야 배포가 즉시 반영된다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
