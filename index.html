<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="이 배가 아닌가벼_HSGINS">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- ★아이콘은 `public/icon.svg` 한 장에서 나온다. 바꾸려면 그 파일만 갈아 끼우고
         `node scripts/make-icons.mjs` 를 돌리면 아래 PNG 들이 전부 다시 만들어진다. -->
    <!-- 브라우저 탭: SVG 가 가장 선명하다. 못 읽는 브라우저를 위해 PNG 도 같이 준다. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.e67b3131.png" />
    <!-- ★iOS 는 apple-touch-icon 에 SVG 를 못 쓴다. SVG 를 가리켜 두면 아이폰
         홈화면에 우리 아이콘 대신 **페이지 스크린샷**이 박힌다(2026-08-30 실측:
         프로덕션이 /icon.svg 를 가리키고 있었다). 반드시 PNG 여야 한다. -->
    <link rel="apple-touch-icon" href="/icon-180.e67b3131.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- 안드로이드 주소창·작업전환기 색. manifest 에만 있으면 설치 전에는 안 먹는다. -->
    <meta name="theme-color" content="#0284c7" />
    <!-- 메모 글꼴. 원래 src/index.css 첫 줄의 @import 였는데, 그러면 빌드된 CSS 의
         첫 바이트가 되어 **렌더차단 스타일시트 안의 @import** 가 된다. 그게 해소될
         때까지 module script 가 실행되지 않아 하루 첫 실행이 ~100ms 늦었다.
         media="print" 로 받아 두고 onload 에서 all 로 올리면 차단하지 않는다.
         .font-memo 는 App.tsx 의 메모 말풍선·입력창 두 곳뿐이라 FOUT 비용이 거의 없다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap"
          media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" /></noscript>
    <title>이 배가 아닌가벼_HSGINS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
