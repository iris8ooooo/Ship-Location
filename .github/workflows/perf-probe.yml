name: Perf probe

# 프로덕션이 실제로 무엇을 어떻게 내려주는지 찍는다. 앱을 건드리지 않는 읽기 전용 진단이다.
#
# 왜 액션인가: 개발 세션의 샌드박스는 run.app 으로 나가는 요청이 프록시에서 막힌다.
# 러너는 막히지 않으므로, 압축 여부·헤더·TTFB·콜드스타트를 여기서 실측한다.
# (러너는 미국에 있어 절대 지연은 한국과 다르다 — 헤더·바이트수·콜드스타트 판정에만 쓸 것.)

on:
  workflow_dispatch:

env:
  SERVICE: hd-ship-location
  REGION: us-west1
  URL: https://hd-ship-location-238928524992.us-west1.run.app

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # ★이 스텝 앞에 요청을 두지 말 것 — 그러면 warm 을 재게 된다.
      #  기존 "Cold start check" 는 바로 앞에서 여러 번 때린 뒤라 warm 만 쟀다.
      #  콜드스타트는 이 계획에서 가장 큰 항목인데 아직 크기를 모른다.
      #  ★쓸모 있으려면 조건이 있다: 최소 20분간 서비스 무트래픽 + 그 사이 배포 없음.
      #  러너가 미국이라 절대값은 한국과 다르지만 COLD − min(WARM) 차분은 그대로 유효하다.
      - name: Real cold start (must be the first request of the run)
        run: |
          curl -sS -o /dev/null -w 'COLD  ttfb=%{time_starttransfer} total=%{time_total}\n' "$URL/"
          for i in 1 2 3; do
            curl -sS -o /dev/null -w "WARM$i ttfb=%{time_starttransfer} total=%{time_total}\n" "$URL/"
          done

      - name: Fetch index.html and the hashed assets it references
        run: |
          set -x
          echo "=== index.html (gzip 요청) — 헤더와 wire 크기 ==="
          curl -sS -D - -o /dev/null -H 'Accept-Encoding: gzip, br' \
            -w '\n[timing] dns=%{time_namelookup} conn=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} http=%{http_version} wire_bytes=%{size_download}\n' \
            "$URL/"

          # ★파싱용으로는 --compressed 로 따로 받는다. 위 요청은 **압축된 바이트**를 주므로
          #  그걸 저장해 grep 하면 /assets/ 경로를 못 찾는다 — 실제로 그렇게 깨졌다
          #  (gzip_min_length 를 256 으로 낮추자 index.html 도 압축 대상이 되면서 드러났다).
          curl -sS --compressed -o /tmp/index.html "$URL/"
          echo "=== index.html 본문 ==="
          cat /tmp/index.html

          ASSETS=$(grep -o '/assets/[A-Za-z0-9._-]*' /tmp/index.html | sort -u)
          # 에셋을 하나도 못 찾으면 조용히 넘어가지 말 것 — 그게 이번에 실제로 일어난 일이고,
          # 초록불만 보고 "압축이 잘 되고 있구나" 로 읽을 뻔했다.
          if [ -z "$ASSETS" ]; then
            echo "::error::index.html 에서 /assets/ 를 하나도 못 찾았다 — 프로브가 깨진 것이다."
            exit 1
          fi
          for A in $ASSETS; do
            echo "=== $A (gzip+br 요청) ==="
            curl -sS -D - -o /tmp/asset.bin -H 'Accept-Encoding: gzip, br' \
              -w '\n[timing] ttfb=%{time_starttransfer} total=%{time_total} http=%{http_version} wire_bytes=%{size_download}\n' \
              "$URL$A"
            echo "--- 같은 파일을 압축 없이 요청했을 때 ---"
            curl -sS -o /dev/null -H 'Accept-Encoding: identity' \
              -w '[timing] raw_bytes=%{size_download}\n' "$URL$A"
          done


      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # ★환경변수 값은 절대 찍지 말 것. 이 레포는 공개라 액션 로그도 공개다.
      #  처음에 --format=yaml 로 통째로 찍었다가 서비스에 박혀 있던 Gemini API 키가
      #  공개 로그에 그대로 남았다(로그 삭제 + 키 교체로 수습). 필요한 필드만 뽑는다.
      - name: Describe the service (scaling, cpu, memory, concurrency) - no env values
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --format='yaml(
              spec.template.metadata.annotations,
              spec.template.spec.containerConcurrency,
              spec.template.spec.containers[].name,
              spec.template.spec.containers[].resources,
              spec.template.spec.containers[].ports,
              spec.template.spec.containers[].startupProbe,
              spec.template.spec.containers[].env[].name
            )'
