name: Tide check

# 조석 기능의 검증 묶음. 이 레포를 만지는 세션은 샌드박스라 네이티브 바이너리(esbuild·자바·크로미움)를 못 돌린다 —
# 그래서 빌드·에뮬레이터 규칙 테스트·실제 렌더를 여기서 한다.
#
#  1. tsc · 파싱/물때 회귀 테스트(실제 KHOA 응답) · 프로덕션 빌드
#  2. 에뮬레이터: 기존 규칙 테스트(ships·history 가 그대로 열려 있나) + meta/tide 규칙 테스트
#  3. 에뮬레이터에 실제 응답을 심고 앱을 **실제로 그려** 스크린샷을 아티팩트로 남긴다
#     (예보 있음 / 오늘치 없음 두 상태). 사용자가 디자인을 보고 확인하는 용도.
#
# ★공개 레포다. 스크린샷에는 KHOA 공개 예보값과 지도만 들어간다 — 사내 데이터는 없다(에뮬레이터라 배도 없다).

on:
  workflow_dispatch:
    inputs:
      prod:
        description: '프로덕션(Cloud Run) 실제 화면도 찍는다 — 진짜 파이어스토어·진짜 시각'
        type: boolean
        default: false
      b64:
        description: '그 화면을 로그에 base64 로도 찍는다 (아티팩트를 못 받는 세션용)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'src/lib/tide.mjs'
      - 'src/lib/tide.d.mts'
      - 'scripts/sync-tide.mjs'
      - 'scripts/test-tide*.mjs'
      - 'scripts/fixtures/khoa-tide-*.json'
      - 'src/App.tsx'
      - 'src/firebase.ts'
      - 'firestore.rules'
      - '.github/workflows/tide-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck · 파싱/물때 테스트 · 프로덕션 빌드
        run: |
          set -o pipefail
          npx tsc --noEmit
          node scripts/test-tide.mjs | tee out-test.log
          npm run build
          {
            echo "## 파싱·물때 테스트 (실제 KHOA 응답)"
            echo '```'
            tail -n 3 out-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 에뮬레이터용 빌드 (VITE_FIRESTORE_EMULATOR)
        run: VITE_FIRESTORE_EMULATOR=127.0.0.1:8080 npx vite build --outDir dist-emu

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: 에뮬레이터 — 규칙 테스트 + 실제 렌더
        run: |
          set -o pipefail
          mkdir -p out/render
          # 실제 KHOA 응답(픽스처)을 액션과 같은 코드로 문서로 만들어 에뮬레이터에 심는다.
          cat > out/seed.mjs <<'EOF'
          import { readFileSync } from 'node:fs';
          import { initializeApp } from 'firebase/app';
          import { getFirestore, connectFirestoreEmulator, doc, setDoc } from 'firebase/firestore';
          import { parseKhoaHighLow, buildTideDoc, TIDE_DOC } from '../src/lib/tide.mjs';
          const cfg = JSON.parse(readFileSync('firebase-applet-config.json', 'utf8'));
          const db = getFirestore(initializeApp(cfg), cfg.firestoreDatabaseId);
          connectFirestoreEmulator(db, '127.0.0.1', 8080);
          const dates = ['2026-09-05', '2026-09-06', '2026-09-07', '2026-09-08'];
          const days = dates.map(d => parseKhoaHighLow(JSON.parse(readFileSync(`scripts/fixtures/khoa-tide-DT_0007-${d.replace(/-/g, '')}.json`, 'utf8')), d));
          const at = Date.UTC(2026, 8, 4, 19, 3);   // 2026-09-05 04:03 KST — 크론 시각
          await setDoc(doc(db, TIDE_DOC.collection, TIDE_DOC.id), buildTideDoc(days, at));
          console.log(`seeded ${dates.length} days`);
          process.exit(0);
          EOF
          cat > out/render.mjs <<'EOF'
          import { chromium } from 'playwright';
          // ★시트를 `data-sea-sheet` 로 잡는다. 예전에는 「🌊 조석표」 글자로 찾았는데,
          //  그러면 **글귀를 다듬는 순간 검사가 깨진다** — 화면을 고칠 때마다 검사를 같이
          //  고치게 되면 검사가 화면을 붙잡는 족쇄가 된다. 뜻은 안 변하는 것으로 잡는다.
          const b = await chromium.launch();
          const shots = [
            // [이름, 브라우저 시계(KST), 기대 문구]
            ['tide-ok',      '2026-09-05T10:00:00+09:00', '음력 24일 무시'],
            // ★저녁 것은 **자정 넘김**을 지킨다. 9/5 21:30 이면 그날 조석이 다 지났으므로
            //  다음은 **내일 첫 조석 00:33** 이어야 한다. 여기가 깨지면 「남은 시간 -156분」
            //  같은 값이 조용히 나온다(에러가 아니라 그냥 이상한 숫자).
            //  예전 기대값은 「썰물 진행중」·「나는 중」이라는 **글귀**였는데, 그건 화면을
            //  다듬을 때마다 같이 깨진다 — 검사는 글귀가 아니라 **셈이 맞는지**를 잡는다.
            ['tide-evening', '2026-09-05T21:30:00+09:00', '다음 간조 | 00:33'],
            ['tide-missing', '2026-09-20T10:00:00+09:00', '조석예보 없음'],
          ];
          const out = [];
          for (const [name, at, expect] of shots) {
            const ctx = await b.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true, locale: 'ko-KR', timezoneId: 'Asia/Seoul' });
            const page = await ctx.newPage();
            await page.clock.setFixedTime(new Date(at));
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
            await page.getByLabel('조석·바람').click({ timeout: 30000 });
            const panel = page.locator('[data-sea-sheet]');
            await panel.waitFor({ timeout: 30000 });
            await page.getByRole('button', { name: '조석', exact: true }).click();
            await page.waitForTimeout(2500);
            await panel.screenshot({ path: `out/render/${name}-panel.png` });
            await page.screenshot({ path: `out/render/${name}-full.png` });
            const txt = (await panel.innerText()).replace(/\n/g, ' | ');
            out.push(`${name}: ${txt.includes(expect) ? '✓' : '✗ (기대 「' + expect + '」)'}  ${txt}`);
            // 바람 탭도 한 장 남긴다 — 같은 시트라 여기서 깨지면 같이 보인다
            if (name === 'tide-ok') {
              await page.getByRole('button', { name: '바람', exact: true }).click();
              await page.waitForTimeout(1200);
              await panel.screenshot({ path: `out/render/${name}-wind.png` });
            }
            await ctx.close();
          }
          await b.close();
          console.log(out.join('\n'));
          if (out.some(l => l.includes('✗'))) process.exit(1);
          EOF
          cat > out/run.sh <<'EOF'
          set -eo pipefail
          node scripts/test-visits-rules.mjs | tee out/rules-visits.log
          node scripts/test-tide-rules.mjs  | tee out/rules-tide.log
          FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 node out/seed.mjs
          npx vite preview --outDir dist-emu --host 127.0.0.1 --port 4173 --strictPort > out/preview.log 2>&1 &
          PV=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4173/ >/dev/null || { echo "preview 가 안 뜬다:"; cat out/preview.log; exit 1; }
          node out/render.mjs | tee out/render.log
          kill $PV || true
          EOF
          npx firebase-tools@13 emulators:exec --only firestore --project ship-location-rules-test "bash out/run.sh"
          {
            echo "## 규칙 테스트"
            echo '```'
            tail -n 2 out/rules-visits.log
            tail -n 2 out/rules-tide.log
            echo '```'
            echo "## 실제 렌더 (아이폰14 크기, 에뮬레이터 데이터)"
            echo '```'
            cat out/render.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tide-render-${{ github.run_number }}
          path: out/render/
          retention-days: 7
          if-no-files-found: ignore

  # ★프로덕션을 **실제로 열어** 본다. 개발 세션은 프록시가 run.app 을 막아 화면을 볼 수 없고,
  #  에뮬레이터 렌더는 「코드가 맞나」만 답한다 — 「지금 사람들이 보는 화면이 맞나」는 여기서만 답한다.
  #  ★공개 레포다. 이 화면에는 KHOA 공개 예보와 야드 도면만 있다(뷰어로 열어 관리자 기능은 안 뜬다).
  prod:
    if: github.event_name == 'workflow_dispatch' && inputs.prod
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 프로덕션 화면 찍기
        run: |
          set -o pipefail
          mkdir -p out/prod
          cat > out/prod.mjs <<'EOF'
          import { chromium } from 'playwright';
          const URL = 'https://hd-ship-location-238928524992.us-west1.run.app/';
          const b = await chromium.launch();
          // ★배치를 확인하는 용도라 dsf 1 이면 충분하다. 2 로 찍으면 PNG 가 커져
          //  로그로 내보낼 수가 없다(아래 b64 스텝).
          const ctx = await b.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1,
            isMobile: true, hasTouch: true, locale: 'ko-KR', timezoneId: 'Asia/Seoul' });
          const page = await ctx.newPage();
          const shot = async (name) => {
            await page.screenshot({ path: `out/prod/${name}.png` });
            await page.screenshot({ path: `out/prod/${name}.jpg`, type: 'jpeg', quality: 62 });
          };
          await page.goto(URL, { waitUntil: 'domcontentloaded' });
          await page.waitForTimeout(6000);                 // 파이어스토어 스냅샷을 기다린다
          await shot('01-map');
          // ── 이름 카드가 수면 칩을 안 덮는지 — **여기서만 진짜로 잴 수 있다.**
          //  이 잡은 저장소가 빈 새 프로필이라 카드가 뜨고, 조석·바람이 **실제 값**이라
          //  칩도 제 크기로 그려진다. 로컬 개발 세션은 프록시가 open-meteo·파이어스토어를
          //  막아 칩이 아예 안 그려지므로 바람 응답을 흉내 내야 한다(그건 흉내다).
          {
            const card = page.locator('input[placeholder="예: 홍길동"]')
              .locator('xpath=ancestor::div[contains(@class,"fixed")][1]');
            const chip = page.getByLabel('조석·바람 자세히 보기');
            const c = await card.count() ? await card.boundingBox() : null;
            const ch = await chip.count() ? await chip.boundingBox() : null;
            if (!c || !ch) {
              console.log(`이름 카드↔칩: 못 쟀다 (카드 ${c ? '있음' : '없음'} · 칩 ${ch ? '있음' : '없음'})`);
            } else {
              const hit = c.x < ch.x + ch.width && ch.x < c.x + c.width
                       && c.y < ch.y + ch.height && ch.y < c.y + c.height;
              console.log(`이름 카드 y${Math.round(c.y)}~${Math.round(c.y + c.height)} · `
                + `칩 y${Math.round(ch.y)}~${Math.round(ch.y + ch.height)} → ${hit ? '✗ 겹침' : '✓ 안 겹침'}`);
              await shot('01b-namecard');
            }
          }
          // ★`exact: true` 가 필요하다. 새 칩의 라벨이 「조석·바람 **자세히 보기**」라
          //  느슨하게 잡으면 FAB 과 칩 **둘 다** 걸려 strict mode 로 죽는다(run 11 에서 실제로).
          await page.getByLabel('조석·바람', { exact: true }).click({ timeout: 30000 });
          await page.waitForTimeout(3000);
          await shot('02-open');
          // 조석 탭을 확실히 고른 뒤 한 장 더 — 기본 탭이 무엇이든 조석을 본다
          await page.getByRole('button', { name: '조석', exact: true }).click({ timeout: 10000 }).catch(() => {});
          await page.waitForTimeout(1500);
          await shot('03-tide');
          // ── 호선 카드(공정창) — 조석·바람 시트와 **같은 방법으로** 닫히는지 실제로 해 본다.
          //  ★로컬에서는 못 잰다: 파이어스토어가 개발 세션에서 막혀 배가 한 척도 없고,
          //   DOM 에 마커를 심어 봐야 React 핸들러가 안 붙어 카드가 안 뜬다.
          //   진짜 배가 있는 곳은 프로덕션뿐이다.
          const card = page.locator('div.fixed').filter({ has: page.getByLabel('닫기') }).first();
          const marker = page.locator('[id^="ship-"]').first();
          if (await marker.count()) {
            await page.getByLabel('닫기').first().click({ timeout: 5000 }).catch(() => {});  // 시트를 먼저 닫는다
            await page.waitForTimeout(600);
            await marker.click({ timeout: 10000 }).catch(() => {});
            await page.waitForTimeout(2500);
            const open1 = await card.count();
            await shot('04-card');
            if (open1) {
              const btn = await page.getByLabel('닫기').first().boundingBox();
              console.log(`호선 카드 닫기 버튼 ${Math.round(btn.width)}x${Math.round(btn.height)}`
                + (btn.width >= 44 && btn.height >= 44 ? ' ✓ 44px 이상' : ' ✗ 작다'));
              const box = await card.boundingBox();
              const cx = box.x + box.width / 2;
              // ① 조금만 끈다 → 닫히면 안 된다
              await page.mouse.move(cx, box.y + 8); await page.mouse.down();
              await page.mouse.move(cx, box.y + 38, { steps: 6 }); await page.mouse.up();
              await page.waitForTimeout(400);
              console.log(`30px 끌었을 때 ${await card.count() ? '✓ 그대로' : '✗ 닫힘'}`);
              // ② 충분히 끈다 → 닫혀야 한다
              const box2 = await card.boundingBox();
              if (box2) {
                await page.mouse.move(cx, box2.y + 8); await page.mouse.down();
                await page.mouse.move(cx, box2.y + 130, { steps: 10 }); await page.mouse.up();
                await page.waitForTimeout(400);
              }
              console.log(`120px 끌었을 때 ${await card.count() ? '✗ 안 닫힘' : '✓ 닫힘'}`);
              // ③ 지도를 밀면 안 닫히고, 톡 치면 닫혀야 한다
              await marker.click({ timeout: 10000 }).catch(() => {});
              await page.waitForTimeout(2000);
              const mx = 195, my = 250;
              await page.mouse.move(mx, my); await page.mouse.down();
              await page.mouse.move(mx - 70, my + 12, { steps: 8 }); await page.mouse.up();
              await page.waitForTimeout(400);
              console.log(`지도를 밀었을 때 ${await card.count() ? '✓ 그대로' : '✗ 닫힘'}`);
              await page.mouse.move(mx, my); await page.mouse.down(); await page.mouse.up();
              await page.waitForTimeout(400);
              console.log(`지도를 톡 쳤을 때 ${await card.count() ? '✗ 안 닫힘' : '✓ 닫힘'}`);
            } else {
              console.log('호선 카드가 안 떴다 — 배를 못 찾았거나 뷰어 모드가 아니다');
            }
          } else {
            console.log('지도에 호선 마커가 없다 — 카드 검사 건너뜀');
          }

          // 시트든 옛 패널이든 열린 것을 글자로 읽는다 — 배포 전후 어느 쪽이어도 뭔가 남는다
          await page.getByLabel('조석·바람', { exact: true }).click({ timeout: 10000 }).catch(() => {});
          await page.waitForTimeout(1500);
          const sheet = page.locator('[data-sea-sheet]');
          const txt = await (await sheet.count()
            ? sheet.innerText()
            : page.locator('div.rounded-2xl').filter({ hasText: '조석' }).first().innerText()
          ).catch(() => '(패널 글자를 못 읽음)');
          console.log('열린 패널:\n' + txt);
          await b.close();
          EOF
          node out/prod.mjs 2>&1 | tee out/prod.log
          {
            echo "## 프로덕션 실제 화면"
            echo '```'
            cat out/prod.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # ★아티팩트를 **못 받는 세션**이 있다. 개발 샌드박스는 프록시가 blob 저장소를 막아
      #  스크린샷을 올려 둬도 열어 볼 수가 없다 — 볼 수 없는 스크린샷은 그 세션에 없는 것과 같다.
      #  `raw.githubusercontent.com` 은 닿으므로 **전용 브랜치 하나에 덮어써서** 그리로 내준다.
      #  ★히스토리를 쌓지 않는다(고아 커밋 + force). 이 브랜치는 언제 지워도 되는 임시물이고
      #   main 에는 영영 들어가지 않는다.
      - name: 화면을 prod-shots 브랜치로 (b64 입력)
        if: inputs.b64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out/prod
          git init -q .
          git checkout -q --orphan prod-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ./*.jpg
          git -c commit.gpgsign=false commit -qm "프로덕션 화면 ${{ github.run_number }} (임시 — 개발 세션이 보려고)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" prod-shots
          echo "→ https://raw.githubusercontent.com/${{ github.repository }}/prod-shots/03-tide.jpg"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tide-prod-${{ github.run_number }}
          path: out/prod/
          retention-days: 7
          if-no-files-found: ignore
