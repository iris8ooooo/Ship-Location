name: Sync tide forecast (KHOA)

# 국립해양조사원(KHOA) 조석예보(고·저조)를 받아 파이어스토어 meta/tide 에 쓴다.
# 앱은 그 문서만 읽는다 — 앱이 KHOA 를 직접 부르지 않는 이유는 src/lib/tide.mjs 머리에 있다
# (공개 레포라 키가 새고, CORS 에 막히고, 하루 한 번 받으면 되는 값이다).
#
# 필요한 시크릿 (Settings → Secrets and variables → Actions):
#   KHOA_SERVICE_KEY  공공데이터포털(data.go.kr)에서 「해양수산부 국립해양조사원_조석예보(고, 저조)」
#                     (publicDataPk=15156018) 활용신청 후 받은 **일반 인증키(Decoding)**.
#                     개발계정은 자동승인이라 신청 즉시 쓸 수 있다(일 10,000건 — 우리는 하루 4건).
#
# ★시크릿이 없을 때 (sync-safetyone.yml 과 같은 규칙):
#   - 크론: 건너뛰되 실행 요약에 "설정 안 됨" 을 크게 적는다.
#   - 수동 실행: **실패시킨다.** 아무 일도 안 하고 초록불이면 "수집되고 있구나" 로 오해한다.
#
# ★공개 레포다. 키·응답 원문을 찍지 않는다. 스크립트는 건수·관측소명·시각·조위 숫자만 찍는다.
# ★한 날이라도 못 받으면 스크립트가 exit 1 — 옛 문서가 남고 앱은 마지막 수신 시각을 보여준다.

on:
  schedule:
    # 조석예보는 연 1회 갱신되는 예보다. 하루 한 번, 새벽에 오늘+3일치를 받아 둔다.
    # 주기를 바꾸면 src/lib/tide.mjs 의 TIDE_SYNC_PERIOD_H 도 같이 바꾼다 (앱이 "갱신 죽음" 을 그 값으로 판정한다).
    - cron: '0 19 * * *'   # KST 04:00
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry=받아서 보여주기만 / apply=파이어스토어에 쓴다'
        type: choice
        options: [dry, apply]
        default: apply

concurrency:
  group: sync-tide
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check that the KHOA key is configured
        id: precheck
        run: |
          if [ -n "${{ secrets.KHOA_SERVICE_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          {
            echo "## ⚠️ 조석예보 수집이 돌지 않았다 — 키 설정 안 됨"
            echo
            echo "\`KHOA_SERVICE_KEY\` 시크릿이 없어서 **KHOA 호출을 통째로 건너뛰었다.** 앱의 조석표는 갱신되지 않았다."
            echo
            echo "1. <https://www.data.go.kr/data/15156018/openapi.do> 에서 **활용신청** (개발계정 자동승인)"
            echo "2. 마이페이지 → 활용신청 현황 → 해당 API → **일반 인증키(Decoding)** 복사"
            echo "3. <https://github.com/${{ github.repository }}/settings/secrets/actions> → New repository secret"
            echo
            echo "| 이름 | 값 |"
            echo "| --- | --- |"
            echo "| \`KHOA_SERVICE_KEY\` | 공공데이터포털 일반 인증키(Decoding) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::KHOA_SERVICE_KEY 가 없어 조석예보를 못 받는다. 위 요약의 경로로 등록할 것."
            exit 1
          fi
          echo "::warning::KHOA_SERVICE_KEY 가 없어 이번 조석예보 수집을 건너뛴다."

      - name: Set up Node
        if: steps.precheck.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        if: steps.precheck.outputs.ready == 'true'
        run: npm ci

      - name: Fetch KHOA and write meta/tide
        if: steps.precheck.outputs.ready == 'true'
        env:
          KHOA_SERVICE_KEY: ${{ secrets.KHOA_SERVICE_KEY }}
        run: |
          # ★pipefail 이 없으면 tee 의 종료코드만 보게 돼 실패가 초록불로 묻힌다.
          set -o pipefail
          mkdir -p out
          node scripts/sync-tide.mjs ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry' && '--dry' || '' }} 2>&1 | tee out/tide.log
          {
            echo "## 조석예보 수집 결과"
            echo
            echo '```'
            cat out/tide.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
