name: Sync SafetyOne positions

# 세이프티원 3중점검 리스트를 긁어 십로케이션 파이어스토어에 반영한다.
# 배는 근무시간에만 움직이고 세이프티원 갱신도 2~3시간 주기라,
# 한국시간 06~20시 매시(UTC 21~23, 0~11)면 충분하다 — 더 자주 긁어봐야
# 사내 서버만 때린다 (CLAUDE.md 수집 원칙).
#
# 필요한 시크릿 (Settings → Secrets and variables → Actions):
#   SAFETYONE_URL  세이프티원 접속 주소 (로그인 페이지)
#   SAFETYONE_ID   사번/아이디
#   SAFETYONE_PW   비밀번호
#
# ★시크릿이 없을 때 (2026-08-29 에 규칙을 바꿨다)
#   - 크론: 건너뛰되 실행 요약에 "설정 안 됨" 을 크게 적는다.
#   - 수동 실행: **실패시킨다.** 사람이 일부러 돌린 건데 아무 일도 안 하고
#     초록불이 뜨면 "수집되고 있구나" 로 오해한다. 실제로 그렇게 오해했다 —
#     시크릿이 없어 한 번도 안 돌았는데 이력만 success 로 남아 있었다.
#
# 실패하면 화면 스크린샷·HTML 이 아티팩트로 남는다. 사이트가 개편되면
# 그걸 보고 scripts/scrape-safetyone.mjs 의 셀렉터를 고친다.

on:
  # ★크론 정지 (2026-08-29). 아직 어느 필드가 선석인지 확정하지 못했다.
  #  사용자 확인: 야드의 배는 전부 제자리이고 호선명 변동도 없다. 그런데 수집은
  #  이동 5 · 추가 7 을 냈다 — 즉 12건이 오답이다. 야드에 없는 호선까지 나오는 걸 보면
  #  지도의 배 레이어(/gis/ships, 27척)가 아니라 점검 이력을 읽고 있는 것이다.
  #  ★2026-08-29 스키마 실측으로 원인 확정: /gis/ships 에는 **선석 이름이 없다.**
  #  shipno + x·y·angle 만 있다. 그러니 좌표계 변환식을 확정할 때까지는 반영할 수 없다.
  #  필드를 확정하기 전까지는 사람이 직접 돌릴 때만 동작한다.
  # schedule:
  #   - cron: '0 21-23,0-11 * * *'   # KST 06:00~20:00 매시
  workflow_dispatch:
    inputs:
      mode:
        description: 'fit=좌표계 맞추기(읽기만) / dry=미리보기 / apply=실제 반영'
        type: choice
        options: [fit, dry, apply]
        default: fit

concurrency:
  group: sync-safetyone
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check that SafetyOne secrets are configured
        id: precheck
        run: |
          MISSING=""
          [ -z "${{ secrets.SAFETYONE_URL }}" ] && MISSING="$MISSING SAFETYONE_URL"
          [ -z "${{ secrets.SAFETYONE_ID }}"  ] && MISSING="$MISSING SAFETYONE_ID"
          [ -z "${{ secrets.SAFETYONE_PW }}"  ] && MISSING="$MISSING SAFETYONE_PW"
          if [ -z "$MISSING" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          {
            echo "## ⚠️ 3중점검 수집이 돌지 않았다"
            echo
            echo "시크릿이 없어서 **수집·반영을 통째로 건너뛰었다.** 지도의 배 위치는 갱신되지 않았다."
            echo
            echo "없는 것:\`$MISSING\`"
            echo
            echo "설정: **Settings → Secrets and variables → Actions → New repository secret**"
            echo "(<https://github.com/${{ github.repository }}/settings/secrets/actions>)"
            echo
            echo "| 이름 | 값 |"
            echo "| --- | --- |"
            echo "| \`SAFETYONE_URL\` | 세이프티원 로그인 페이지 주소 |"
            echo "| \`SAFETYONE_ID\` | 사번/아이디 |"
            echo "| \`SAFETYONE_PW\` | 비밀번호 |"
          } >> "$GITHUB_STEP_SUMMARY"
          # 사람이 직접 돌렸으면 조용히 넘어가지 않는다 — 초록불이 곧 "수집됨" 으로 읽힌다.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::SAFETYONE_*$MISSING 이 없어 수집을 못 한다. 위 요약의 경로로 등록할 것."
            exit 1
          fi
          echo "::warning::SAFETYONE_*$MISSING 이 없어 이번 수집을 건너뛴다."

      - name: Set up Node
        if: steps.precheck.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        if: steps.precheck.outputs.ready == 'true'
        run: npm ci

      - name: Cache Playwright browser
        if: steps.precheck.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Chromium
        if: steps.precheck.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Scrape SafetyOne list
        if: steps.precheck.outputs.ready == 'true'
        env:
          SAFETYONE_URL: ${{ secrets.SAFETYONE_URL }}
          SAFETYONE_ID: ${{ secrets.SAFETYONE_ID }}
          SAFETYONE_PW: ${{ secrets.SAFETYONE_PW }}
        run: node scripts/scrape-safetyone.mjs --out out/safetyone-list.json

      # 무엇을 읽었는지 먼저 본다 — 확인 없이 프로덕션에 쓰면 배를 엉뚱한 데로
      # 옮긴다(2026-08-29 실제로 그랬다).
      - name: Show what was collected
        if: steps.precheck.outputs.ready == 'true' && inputs.mode != 'apply'
        run: |
          {
            echo "## 수집한 원본 (호선 → 위치/좌표)"
            echo
            echo '```'
            node -e "const j=require('./out/safetyone-list.json');console.log('kind:',j.kind,'·',j.rows.length,'척');for(const r of j.rows)console.log(r.hull,'→',j.kind==='coords'?\`x=\${r.x} y=\${r.y} angle=\${r.angle} rot=\${r.rotation}\`:r.loc)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ★좌표계 맞추기. 아무것도 쓰지 않고 변환식 계수와 잔차만 낸다.
      #  세이프티원 배 레이어는 선석 이름이 아니라 x·y 를 준다 — 그 좌표가 우리 야드의
      #  어디인지 확정되기 전에는 선석 이름을 붙일 수 없다.
      - name: Fit yard transform (writes nothing)
        if: steps.precheck.outputs.ready == 'true' && inputs.mode == 'fit'
        run: |
          set -o pipefail
          node scripts/fit-yard-transform.mjs --input out/safetyone-list.json | tee out/fit.log
          {
            echo "## 좌표계 맞추기 결과"
            echo
            echo '```'
            cat out/fit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply to Firestore
        if: steps.precheck.outputs.ready == 'true' && inputs.mode != 'fit'
        run: |
          # ★pipefail 이 없으면 tee 의 종료코드만 보게 돼 반영 실패가 초록불로 묻힌다.
          set -o pipefail
          node scripts/sync-safetyone.mjs --input out/safetyone-list.json ${{ inputs.mode == 'dry' && '--dry' || '' }} | tee out/apply.log
          {
            echo "## 3중점검 수집 결과"
            echo
            echo '```'
            cat out/apply.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 실패 시 화면 "구조" 만 남긴다 — 다음 클로드 세션이 이걸 읽고
      # 사용자 없이 셀렉터를 고친다.
      #
      # ★out/ 을 통째로 올리면 안 된다. 이 레포는 공개고 액션 아티팩트도
      #  공개로 내려받힌다 — 사내 시스템의 HTML·스크린샷을 올리는 건 곧 유출이다.
      #  skeleton.json 만 올린다(태그·class·개수뿐, 글자 없음).
      - name: Upload failure evidence (structure only, no page text)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safetyone-failure-${{ github.run_number }}
          path: out/skeleton.json
          retention-days: 7
          if-no-files-found: ignore
