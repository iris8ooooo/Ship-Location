name: Sync SafetyOne positions

# 세이프티원 3중점검 리스트를 긁어 십로케이션 파이어스토어에 반영한다.
# 배는 근무시간에만 움직이고 세이프티원 갱신도 2~3시간 주기라,
# 한국시간 06~20시 매시(UTC 21~23, 0~11)면 충분하다 — 더 자주 긁어봐야
# 사내 서버만 때린다 (CLAUDE.md 수집 원칙).
#
# 필요한 시크릿 (Settings → Secrets and variables → Actions):
#   SAFETYONE_URL  세이프티원 접속 주소 (로그인 페이지)
#   SAFETYONE_ID   사번/아이디
#   SAFETYONE_PW   비밀번호
# 시크릿이 없으면 조용히 건너뛴다 — 설정 전까지 액션이 빨갛게 뜨지 않게.
#
# 실패하면 화면 스크린샷·HTML 이 아티팩트로 남는다. 사이트가 개편되면
# 그걸 보고 scripts/scrape-safetyone.mjs 의 셀렉터를 고친다.

on:
  schedule:
    - cron: '0 21-23,0-11 * * *'   # KST 06:00~20:00 매시
  workflow_dispatch:

concurrency:
  group: sync-safetyone
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check that SafetyOne secrets are configured
        id: precheck
        run: |
          if [ -z "${{ secrets.SAFETYONE_URL }}" ] \
          || [ -z "${{ secrets.SAFETYONE_ID }}" ] \
          || [ -z "${{ secrets.SAFETYONE_PW }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SAFETYONE_* secrets not set - skipping sync."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.precheck.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        if: steps.precheck.outputs.ready == 'true'
        run: npm ci

      - name: Cache Playwright browser
        if: steps.precheck.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Chromium
        if: steps.precheck.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Scrape SafetyOne list
        if: steps.precheck.outputs.ready == 'true'
        env:
          SAFETYONE_URL: ${{ secrets.SAFETYONE_URL }}
          SAFETYONE_ID: ${{ secrets.SAFETYONE_ID }}
          SAFETYONE_PW: ${{ secrets.SAFETYONE_PW }}
        run: node scripts/scrape-safetyone.mjs --out out/safetyone-list.json

      - name: Apply to Firestore
        if: steps.precheck.outputs.ready == 'true'
        run: node scripts/sync-safetyone.mjs --input out/safetyone-list.json

      # 실패 시 현장 보존 — 다음 클로드 세션이 이 아티팩트를 읽고
      # 사용자 없이 셀렉터를 고친다.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safetyone-failure-${{ github.run_number }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
