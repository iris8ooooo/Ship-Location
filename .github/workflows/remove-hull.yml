name: Remove a hull from the map

# 야드를 떠난 배(시운전·출항·인도)를 지도에서 지운다. **사람이 확인하고 손으로 돌린다.**
#
# ★수집(sync-safetyone)에는 삭제 권한을 주지 않는다. "리스트에 없는 호선은 손대지 않는다"
#  는 규칙이 있고, 수집이 배를 지울 수 있게 되는 순간 **오독 한 번이 곧 데이터 손실**이다.
#  세이프티원이 잠깐 배를 빠뜨리는 것과 배가 진짜로 떠난 것을 기계는 구분하지 못한다.
#
# ★지우기 전에 문서를 **통째로 찍는다.** 되돌릴 수 있어야 지워도 되는 것이다 —
#  로그에 남은 값이면 restore-positions.yml 처럼 그대로 복구할 수 있다.
#
# ★호선번호를 **두 번** 받는다. 한 번은 지울 대상, 한 번은 확인용. 다르면 아무것도 안 한다.
#  일회성 파일(remove-8285.yml)을 호선마다 새로 만들던 것을 이걸로 대신한다 —
#  파일이 쌓이면 어느 것이 최신인지 헷갈리고, 헷갈리면 엉뚱한 배를 지운다.
#
# ★배가 시운전에서 돌아오면 **수집이 알아서 다시 만든다**(kind: 'create'). 즉 이 삭제는
#  영구적인 손실이 아니라 "지금 야드에 없다" 를 지도에 반영하는 것뿐이다.

on:
  workflow_dispatch:
    inputs:
      hull:
        description: '지울 호선번호 (예: 8222)'
        required: true
      confirm:
        description: '확인 — 같은 호선번호를 한 번 더 (다르면 중단)'
        required: true
      reason:
        description: '이력에 남길 이유'
        required: false
        default: '시운전'

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: 두 입력이 같은지부터 본다
        env:
          HULL: ${{ github.event.inputs.hull }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$HULL" != "$CONFIRM" ]; then
            echo "::error::호선번호가 서로 다르다 ('$HULL' vs '$CONFIRM'). 아무것도 안 했다."
            exit 1
          fi
          if ! printf '%s' "$HULL" | grep -qE '^[0-9]{4}$'; then
            echo "::error::호선번호는 네 자리 숫자여야 한다 ('$HULL'). 아무것도 안 했다."
            exit 1
          fi
          echo "지울 대상: $HULL"

      - name: 문서를 통째로 찍고, 지운다
        env:
          HULL: ${{ github.event.inputs.hull }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          set -o pipefail
          node --input-type=module <<'JS' | tee remove.log
          import { readFileSync } from 'node:fs';
          import { initializeApp } from 'firebase/app';
          import { getFirestore, doc, getDoc, deleteDoc, addDoc, collection } from 'firebase/firestore';

          const HULL = process.env.HULL;
          const REASON = (process.env.REASON || '').trim() || '야드 밖';
          const cfg = JSON.parse(readFileSync('firebase-applet-config.json', 'utf8'));
          const db = getFirestore(initializeApp(cfg), cfg.firestoreDatabaseId);

          const ref = doc(db, 'ships', HULL);
          const snap = await getDoc(ref);
          if (!snap.exists()) {
            console.log(`${HULL} 은 이미 없다 — 할 일 없음.`);
            process.exit(0);
          }

          const data = snap.data();
          console.log(`지우기 전 ${HULL} 의 내용 (되돌릴 때 이 값을 그대로 쓴다):`);
          console.log(JSON.stringify(data, null, 1));

          await deleteDoc(ref);
          console.log(`삭제 완료 ${HULL} — 이유: ${REASON}`);

          // ★이력에 남긴다. 배가 지도에서 조용히 사라지면 뷰어는 무슨 일이 있었는지 모른다 —
          //  이 레포는 "실패도 변화도 조용히 넘어가지 않는다" 를 원칙으로 삼는다.
          await addDoc(collection(db, 'history'), {
            action: `삭제 — ${REASON}`,
            shipId: HULL,
            author: '관리자',
            timestamp: Date.now(),
          }).catch(e => console.log(`⚠ 이력은 못 남겼다 (삭제는 됐다): ${e?.code ?? e}`));
          console.log('이력에 남김');
          process.exit(0);
          JS

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ github.event.inputs.hull }} 삭제 — ${{ github.event.inputs.reason }}"
            echo
            echo '되돌리려면 아래 값을 그대로 다시 넣으면 된다.'
            echo
            echo '```'
            cat remove.log || echo '(로그 없음 — 검증 단계에서 멈춘 것이다)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
