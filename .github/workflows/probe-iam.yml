name: Probe IAM (one-off)

# "룰 배포 403 을 나 스스로 풀 수 있나" 를 재는 일회성 액션이다 (CLAUDE.md 0번 규칙).
# 사용자에게 권한 부여를 부탁하기 전에, 배포 SA 가 스스로 권한을 줄 수 있는지 먼저 잰다.
#
# ★공개 레포다. 사람 이메일·SA 이메일·정책 전문을 절대 찍지 않는다.
#   출력은 "권한 이름 → 있음/없음" 과 역할 이름 목록뿐이다.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check that GCP secrets are configured
        id: precheck
        run: |
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ] \
          || [ -z "${{ secrets.GCP_WIF_PROVIDER }}" ] \
          || [ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "::error::GCP secrets not set."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: 이 SA 가 무엇을 할 수 있나
        env:
          P: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -u
          # 프로젝트 단위 권한 확인. 읽기 전용이고, 되돌아오는 건 권한 이름뿐이라
          # 공개 로그에 남아도 안전하다.
          PERMS=resourcemanager.projects.setIamPolicy,resourcemanager.projects.getIamPolicy,firebaserules.rulesets.test,firebaserules.rulesets.create,firebaserules.releases.update,firebaserules.releases.get
          echo "=== 가진 권한 (없는 것은 아래 목록에 안 나온다) ==="
          gcloud projects test-iam-permissions "$P" --permissions="$PERMS" --format='value(permissions)' || echo "(test-iam-permissions 자체가 거부됨)"

          echo
          echo "=== 결론 ==="
          HAVE=$(gcloud projects test-iam-permissions "$P" --permissions="$PERMS" --format='value(permissions)' 2>/dev/null || true)
          case "$HAVE" in
            *resourcemanager.projects.setIamPolicy*)
              echo "SA 가 스스로 역할을 줄 수 있다 → 사용자에게 부탁할 필요 없음." ;;
            *)
              echo "SA 는 스스로 역할을 줄 수 없다 → 사용자만 할 수 있는 일이 맞다." ;;
          esac
          case "$HAVE" in
            *firebaserules.rulesets.test*) echo "룰 배포 권한은 이미 있다(?) — 403 원인이 다른 데 있다." ;;
            *) echo "룰 배포 권한 없음 — 403 의 원인이 이것이 맞다." ;;
          esac
