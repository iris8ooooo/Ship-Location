name: Remove hull 8285 (not in the yard)

# 일회성이다. 8285 는 야드에 없는 배인데 지도에 남아 있었다 —
# 이전 세션에서 내가 만들어 둔 것이고, 사용자가 야드를 보고 확인해 줬다(2026-08-29).
# 세이프티원 지도 배 레이어에도 8285 는 없다(23척 중 없음).
#
# ★지우기 전에 문서를 통째로 찍는다. 되돌릴 수 있어야 지워도 되는 것이다 —
#  로그에 남은 값이면 restore-positions.yml 처럼 그대로 복구할 수 있다.
# ★수집(sync-safetyone)에는 삭제 권한을 주지 않는다. 리스트에 없는 호선은 손대지 않는
#  다는 규칙이 있고, 수집이 배를 지울 수 있게 되는 순간 오독 한 번이 곧 데이터 손실이다.

on:
  workflow_dispatch:

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Print the document, then delete it
        run: |
          set -o pipefail
          node --input-type=module <<'JS' | tee remove.log
          import { readFileSync } from 'node:fs';
          import { initializeApp } from 'firebase/app';
          import { getFirestore, doc, getDoc, deleteDoc } from 'firebase/firestore';

          const HULL = '8285';
          const cfg = JSON.parse(readFileSync('firebase-applet-config.json', 'utf8'));
          const db = getFirestore(initializeApp(cfg), cfg.firestoreDatabaseId);

          const ref = doc(db, 'ships', HULL);
          const snap = await getDoc(ref);
          if (!snap.exists()) { console.log(`${HULL} 은 이미 없다 — 할 일 없음.`); process.exit(0); }
          console.log(`지우기 전 ${HULL} 의 내용 (되돌릴 때 이 값을 쓴다):`);
          console.log(JSON.stringify(snap.data(), null, 1));
          await deleteDoc(ref);
          console.log(`삭제 완료 ${HULL}`);
          process.exit(0);
          JS
      - name: Summary
        if: always()
        run: |
          {
            echo "## 8285 삭제"
            echo
            echo '```'
            cat remove.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
